name: Build Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Test Python analyzer
        run: |
          python -m pip install jedi==0.19.2 packaging==25.0
          python -m unittest discover -s app/src/test/python -v
      - name: Install native build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Fetch pinned llama.cpp
        run: bash scripts/bootstrap-llama.sh
      - run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: PY4U-arm64-smooth-motion
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
