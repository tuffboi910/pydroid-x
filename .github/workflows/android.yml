name: Build Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Configure local AI backend
        run: |
          git -C libs/llama.kt apply ../../patches/llama-kt-opencl-only.patch
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/local/lib/android/sdk "ndk;27.2.12479018" >/dev/null
          bash libs/llama.kt/scripts/build-opencl.sh
      - name: Test Python analyzer
        run: python -m unittest discover -s app/src/test/python -v
      - run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: PY4U-arm64-final
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
